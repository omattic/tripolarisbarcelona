name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify static files
        run: node scripts/verify-static.mjs

      - name: Capture deployment timestamp
        id: metadata
        run: echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Assemble GitHub Pages artifact
        env:
          DEPLOYED_AT: ${{ steps.metadata.outputs.deployed_at }}
        run: |
          set -euo pipefail
          rm -rf .github-pages
          mkdir -p .github-pages
          cp index.html styles.css script.js pdf-viewer.mjs README.md CNAME .github-pages/
          cp -R carta .github-pages/
          cp -R qr .github-pages/
          cp -R assets docs .github-pages/
          touch .github-pages/.nojekyll
          node - <<'NODE'
          const fs = require("node:fs");
          const health = {
            branch: process.env.GITHUB_REF_NAME,
            commitHash: process.env.GITHUB_SHA,
            deployedAt: process.env.DEPLOYED_AT
          };
          fs.writeFileSync(".github-pages/health.json", `${JSON.stringify(health, null, 2)}\n`);
          NODE

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .github-pages

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page_url="${PAGE_URL%/}"
          if ! curl --retry 12 --retry-delay 10 --fail --show-error --silent "${page_url}/health.json" | tee health.json; then
            echo "::warning::GitHub Pages deployment completed, but ${page_url}/health.json is not reachable yet. Check custom-domain DNS and certificate provisioning."
            exit 0
          fi
          curl --retry 12 --retry-delay 10 --fail --show-error --silent "${page_url}/" | grep -i "Tripolaris"
          curl --location --retry 12 --retry-delay 10 --fail --show-error --silent "${page_url}/qr" | grep "assets/qr/tripolaris-home.svg"
          node - <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
          if (health.branch !== process.env.GITHUB_REF_NAME) {
            throw new Error(`Live branch ${health.branch} did not match ${process.env.GITHUB_REF_NAME}`);
          }
          if (health.commitHash !== process.env.GITHUB_SHA) {
            throw new Error(`Live commit ${health.commitHash} did not match ${process.env.GITHUB_SHA}`);
          }
          if (!health.deployedAt) {
            throw new Error("Live health is missing deployedAt");
          }
          NODE
