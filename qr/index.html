<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Tripolaris Barcelona</title>
    <meta
      name="description"
      content="QR escaneable para abrir la web de Tripolaris Barcelona."
    />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Josefin+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css?v=20260823-2" />
  </head>
  <body class="qr-page">
    <main class="qr-shell" aria-labelledby="qr-title">
      <section class="qr-panel">
        <p class="eyebrow">Escanea la web</p>
        <h1 id="qr-title" class="qr-logo-title">
          <a href="../" aria-label="Volver a Tripolaris">
            <img src="../assets/tripolaris-logo.png" alt="Tripolaris" />
          </a>
        </h1>
        <p>
          Abre directamente
          <a href="https://tripolarisbarcelona.com">tripolarisbarcelona.com</a>
        </p>

        <figure class="qr-code-frame">
          <img
            src="../assets/qr/tripolaris-home.svg"
            alt="QR para abrir https://tripolarisbarcelona.com"
          />
        </figure>

        <a class="button" href="https://tripolarisbarcelona.com">Abrir web</a>
      </section>
    </main>
  </body>
</html>
